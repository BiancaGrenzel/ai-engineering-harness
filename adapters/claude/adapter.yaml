# Claude adapter metadata (loaded and validated by the generator).
# Contract: adapters/ARCHITECTURE.md
#
# version = adapter implementation version (not Harness config version, not Tool version).

name: claude
agent: claude
version: 1
status: experimental

supported_capabilities:
  - rules
  - skills

unsupported_capabilities:
  - tools

input:
  - .harness/harness.yaml
  - profiles/
  - rules/
  - skills/
  - tools/registry.yaml
  - docs/tools/

output:
  rules_dir: .claude/rules
  skills_dir: .claude/skills
  managed_manifest: .harness/adapters/claude.managed.json

notes:
  - Tools selected in harness.yaml are resolved and reported but not projected into Claude-native config.
  - "Rules are materialized under .claude/rules/ (canonical remains source of truth; regenerate to sync)."
  - "Skills are thin wrappers under .claude/skills/<skill-id>/SKILL.md pointing at canonical skills/."
  - CLAUDE.md is intentionally not managed by this adapter (project/user instruction file).
  - "At-path imports are verified for CLAUDE.md only; not used in .claude/rules/ projections."
